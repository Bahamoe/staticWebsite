<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cool site | 404</title>
  </head>
  <body>
    <h1>404</h1>
    <script>
      var standalonePages = ["/analytics/"];
      var isStandalonePage = standalonePages.some(function (page) {
        return location.pathname.startsWith(page);
      });

      if (isStandalonePage) {
        // Do nothing
      } else {
        window.location.replace("/");
      }
    </script>
  </body>
</html>
